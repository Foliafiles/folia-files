name: Bug report
description: Something in Folia Files doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks! Please never paste a license key or private file names here. For purchases and licenses, write to support@foliafiles.com."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Folia Files version
      description: Folia Files › About Folia Files (e.g. 1.0.3, website version or Mac App Store).
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Air M2
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Press …"
